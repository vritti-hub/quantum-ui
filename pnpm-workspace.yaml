allowBuilds:
  # required: vite's bundler; its postinstall links the platform binary
  esbuild: true

overrides:
  # dev-only chains that pin vulnerable versions:
  #   @microsoft/api-extractor (via vite-plugin-dts) pins lodash < 4.17.24
  lodash: ^4.18.1
  #   react-docgen (via @storybook/react) pins @babel/core < 7.29.6
  '@babel/core': ^7.29.6
